<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าเว็บทดสอบ</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f1ff; color: #30204a; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    main { background: white; padding: 28px; border-radius: 16px; text-align: center; box-shadow: 0 8px 24px #30204a18; }
    button { background: #6d3ac7; color: white; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>สวัสดี 👋</h1>
    <p>นี่คือหน้าเว็บ HTML แบบไฟล์เดียว สำหรับทดสอบ</p>
    <button onclick="document.getElementById('message').textContent='ปุ่มทำงานแล้ว!'">กดทดสอบ</button>
    <p id="message"></p>
  </main>
</body>
</html>
